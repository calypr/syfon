apiVersion: batch/v1
kind: Job
metadata:
  name: calypr-storage-check
  labels:
    calypr.syfon/scenario: storage
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
          command: [/bin/sh, /scenarios/storage-check.sh]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-ci
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-ci
                  key: secret-key
          volumeMounts:
            - name: scenarios
              mountPath: /scenarios
              readOnly: true
      volumes:
        - name: scenarios
          configMap:
            name: calypr-scenarios
---
apiVersion: batch/v1
kind: Job
metadata:
  name: calypr-restart-reader
  labels:
    calypr.syfon/scenario: restart
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reader
          image: syfon-calypr-client:ci
          imagePullPolicy: Never
          command:
            - /bin/bash
            - -c
            - /bin/bash /scenarios/reader.sh && echo 'SCENARIO restart-persistence PASS'
          envFrom:
            - secretRef:
                name: calypr-user-tokens
          volumeMounts:
            - name: work
              mountPath: /work
            - name: scenarios
              mountPath: /scenarios
              readOnly: true
            - name: ca
              mountPath: /usr/local/share/ca-certificates/calypr-ca.crt
              subPath: ca.crt
              readOnly: true
      volumes:
        - name: work
          emptyDir: {}
        - name: scenarios
          configMap:
            name: calypr-scenarios
        - name: ca
          secret:
            secretName: calypr-test-ca
